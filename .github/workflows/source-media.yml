name: Complete the piano workshop galleries
on:
  push:
    branches: [source-recovery-nov26]
    paths: ['.github/transport/plan.json']
permissions:
  contents: read
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retrieve and prepare the remaining photographs
        run: |
          python3 .github/transport/retrieve.py
          mv media-transfer raw
          python3 -m venv "$RUNNER_TEMP/picture"
          "$RUNNER_TEMP/picture/bin/pip" --disable-pip-version-check -q install Pillow==11.3.0
          "$RUNNER_TEMP/picture/bin/python" .github/transport/prepare-images.py
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-laans-piano-b
          path: gallery/
          compression-level: 0
          retention-days: 1
