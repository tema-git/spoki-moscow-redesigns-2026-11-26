name: Complete the manufacturer's technical gallery
on:
  push:
    branches: [source-recovery-nov26]
    paths: ['.github/transport/plan.json']
permissions:
  contents: read
jobs:
  drawings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve the full-resolution technical originals
        run: python3 .github/transport/retrieve.py
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-virtu-style-tech
          path: media-transfer/
          compression-level: 0
          retention-days: 1
